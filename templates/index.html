<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>clipper-web</title>
    <style>
      :root {
        --page-bg: #090c10;
        --surface: #101820;
        --surface-raised: #121b22;
        --border: #303942;
        --text: #f4f7f8;
        --muted: #a6b3bc;
        --accent: #f90000;
        --accent-pressed: #d10000;
        --accent-muted: rgba(249, 0, 0, 0.24);
        --field-bg: #090c10;
        --success: #9ae3a7;
        --error: #ff8c8c;
        --console-text: #d7f8df;
        --console-muted: #789586;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--page-bg);
        color: var(--text);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 24px;
      }

      body.is-embed {
        display: block;
        min-height: auto;
        padding: 0;
        background: transparent;
      }

      button,
      input,
      select,
      textarea {
        width: 100%;
        font: inherit;
      }

      .converter-shell {
        width: min(980px, 100%);
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface);
        animation: frame-in 180ms ease-out both;
      }

      body.is-page .converter-shell {
        box-shadow: 0 18px 42px rgba(0, 0, 0, 0.28);
      }

      body.is-embed .converter-shell {
        width: 100%;
        box-shadow: none;
      }

      .converter-header {
        padding: 18px 22px;
        border-bottom: 1px solid var(--border);
        background: var(--surface-raised);
      }

      .brand {
        margin: 0;
        font-size: 0.95rem;
        font-weight: 700;
        letter-spacing: 0;
        line-height: 1.2;
        text-transform: lowercase;
      }

      .converter-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr);
      }

      .panel {
        padding: 22px;
      }

      .panel + .panel {
        border-left: 1px solid var(--border);
      }

      .panel-title {
        margin: 0 0 16px;
        font-size: 1.1rem;
        font-weight: 650;
        line-height: 1.3;
      }

      .field {
        margin-top: 14px;
      }

      .field:first-of-type {
        margin-top: 0;
      }

      label {
        display: block;
        margin: 0 0 8px;
        color: var(--muted);
        font-size: 0.86rem;
      }

      input,
      select,
      textarea {
        border: 1px solid var(--border);
        border-radius: 8px;
        outline: none;
        background: var(--field-bg);
        color: var(--text);
        padding: 12px 14px;
        transition: border-color 140ms ease, background-color 140ms ease;
      }

      input:focus,
      select:focus,
      textarea:focus {
        border-color: var(--accent);
        background: #0c1117;
      }

      textarea {
        min-height: 200px;
        resize: vertical;
      }

      .action-row {
        margin-top: 14px;
      }

      button {
        border: 0;
        border-radius: 8px;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
        font-weight: 700;
        padding: 12px 16px;
        transition: background-color 140ms ease, opacity 140ms ease, transform 140ms ease;
      }

      button:hover {
        background: var(--accent-pressed);
      }

      button:active {
        transform: translateY(1px);
      }

      button:disabled {
        cursor: wait;
        opacity: 0.72;
      }

      .output-box {
        min-height: 150px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--field-bg);
        color: #e7f2f6;
        line-height: 1.6;
        padding: 16px;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .output-box.is-typing::after {
        content: "";
        display: inline-block;
        width: 0.55ch;
        height: 1em;
        margin-left: 2px;
        background: var(--accent);
        vertical-align: -0.15em;
        animation: caret-blink 900ms steps(2, start) infinite;
      }

      .result-panel {
        display: flex;
        min-width: 0;
        flex-direction: column;
      }

      .console-title {
        margin-top: 18px;
      }

      .process-console {
        min-height: 240px;
        max-height: 380px;
        overflow-y: auto;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: #05080b;
        color: var(--console-text);
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        font-size: 0.82rem;
        line-height: 1.55;
        padding: 14px;
        scrollbar-color: var(--console-muted) #05080b;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .console-line {
        min-height: 1.55em;
      }

      .process-console.is-streaming .console-line:last-child::after {
        content: "";
        display: inline-block;
        width: 0.55ch;
        height: 1em;
        margin-left: 3px;
        background: var(--console-text);
        vertical-align: -0.16em;
        animation: caret-blink 900ms steps(2, start) infinite;
      }

      .status {
        display: flex;
        align-items: center;
        min-height: 18px;
        margin-top: 12px;
        color: var(--muted);
        font-size: 0.82rem;
        gap: 8px;
      }

      .status.is-loading::before {
        content: "";
        flex: 0 0 auto;
        width: 13px;
        height: 13px;
        border: 2px solid var(--accent-muted);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 800ms linear infinite;
      }

      .status.error {
        color: var(--error);
      }

      .status.success {
        color: var(--success);
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes caret-blink {
        50% {
          opacity: 0;
        }
      }

      @keyframes frame-in {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 1ms !important;
          transition-duration: 1ms !important;
        }
      }

      @media (max-width: 760px) {
        body {
          padding: 14px;
        }

        body.is-embed {
          padding: 0;
        }

        .converter-grid {
          grid-template-columns: 1fr;
        }

        .panel + .panel {
          border-top: 1px solid var(--border);
          border-left: 0;
        }
      }
    </style>
  </head>
  <body class="{{ 'is-embed' if embed_mode else 'is-page' }}">
    <main class="converter-shell">
      <header class="converter-header">
        <h1 class="brand">clipper-web</h1>
      </header>

      <div class="converter-grid">
        <section class="panel">
          <h2 class="panel-title">Encrypt or decrypt text</h2>

          <div class="field">
            <label for="seed-word">Seed word</label>
            <input id="seed-word" type="text" value="TEST" placeholder="Enter seed word" />
          </div>

          <div class="field">
            <label for="mode">Mode</label>
            <select id="mode">
              <option value="encrypt">Encrypt</option>
              <option value="decrypt">Decrypt</option>
            </select>
          </div>

          <div class="field">
            <label for="source-text">Input</label>
            <textarea id="source-text" placeholder="Enter text to convert">HELLO WORLD</textarea>
          </div>

          <div class="action-row">
            <button id="convert-btn" type="button">Convert</button>
          </div>

          <div id="status" class="status" aria-live="polite"></div>
        </section>

        <section class="panel result-panel">
          <h2 class="panel-title">Result</h2>
          <div id="output" class="output-box">Ready to translate.</div>
          <h2 class="panel-title console-title">Process console</h2>
          <div
            id="process-console"
            class="process-console"
            role="log"
            aria-live="polite"
            aria-label="Conversion process"
          >
            <div class="console-line">&gt; waiting for input</div>
          </div>
        </section>
      </div>
    </main>

    <script>
      const isEmbed = document.body.classList.contains('is-embed');
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const convertEndpoint = "{{ url_for('convert') }}";

      const convertButton = document.getElementById('convert-btn');
      const sourceText = document.getElementById('source-text');
      const seedWord = document.getElementById('seed-word');
      const mode = document.getElementById('mode');
      const output = document.getElementById('output');
      const status = document.getElementById('status');
      const processConsole = document.getElementById('process-console');

      const typewriterDelayMs = reduceMotion ? 0 : 28;
      const consoleLineDelayMs = reduceMotion ? 0 : 55;
      let typewriterTimer = null;
      let consoleTimer = null;
      let conversionRequestId = 0;
      let embedResizeFrame = null;

      function getDocumentHeight() {
        return Math.ceil(Math.max(
          document.body.scrollHeight,
          document.documentElement.scrollHeight,
          document.body.offsetHeight,
          document.documentElement.offsetHeight
        ));
      }

      function postEmbedResize() {
        if (!isEmbed || window.parent === window) return;

        window.parent.postMessage({
          type: 'clipper-web:resize',
          height: getDocumentHeight()
        }, '*');
      }

      function scheduleEmbedResize() {
        if (!isEmbed || window.parent === window || embedResizeFrame) return;

        embedResizeFrame = window.requestAnimationFrame(() => {
          embedResizeFrame = null;
          postEmbedResize();
        });
      }

      function setStatus(message, state = '') {
        status.textContent = message;
        status.className = state ? `status ${state}` : 'status';
        scheduleEmbedResize();
      }

      function setButtonLoading(isLoading) {
        convertButton.disabled = isLoading;
        convertButton.textContent = isLoading ? 'Converting...' : 'Convert';
      }

      function stopTypewriter() {
        window.clearTimeout(typewriterTimer);
        typewriterTimer = null;
        output.classList.remove('is-typing');
        output.removeAttribute('aria-busy');
        scheduleEmbedResize();
      }

      function stopConsoleAnimation() {
        window.clearTimeout(consoleTimer);
        consoleTimer = null;
        processConsole.classList.remove('is-streaming');
        processConsole.removeAttribute('aria-busy');
        scheduleEmbedResize();
      }

      function appendConsoleLine(line) {
        const lineElement = document.createElement('div');
        lineElement.className = 'console-line';
        lineElement.textContent = line;
        processConsole.appendChild(lineElement);
        processConsole.scrollTop = processConsole.scrollHeight;
        scheduleEmbedResize();
      }

      function setConsoleLines(lines) {
        stopConsoleAnimation();
        processConsole.textContent = '';
        lines.forEach(appendConsoleLine);
      }

      function playConsoleTrace(lines) {
        const traceLines = Array.isArray(lines) && lines.length ? lines : ['> no process trace returned'];
        stopConsoleAnimation();
        processConsole.textContent = '';

        if (reduceMotion) {
          traceLines.forEach(appendConsoleLine);
          return;
        }

        processConsole.classList.add('is-streaming');
        processConsole.setAttribute('aria-busy', 'true');

        let index = 0;

        function printNextLine() {
          if (index >= traceLines.length) {
            stopConsoleAnimation();
            return;
          }

          appendConsoleLine(traceLines[index]);
          index += 1;
          consoleTimer = window.setTimeout(printNextLine, consoleLineDelayMs);
        }

        printNextLine();
      }

      function typeOutput(text) {
        stopTypewriter();
        const typedText = String(text);

        if (reduceMotion) {
          output.textContent = typedText;
          scheduleEmbedResize();
          return;
        }

        output.textContent = '';
        output.classList.add('is-typing');
        output.setAttribute('aria-busy', 'true');

        let index = 0;

        function printNextCharacter() {
          if (index >= typedText.length) {
            stopTypewriter();
            return;
          }

          output.textContent += typedText.charAt(index);
          index += 1;
          scheduleEmbedResize();
          typewriterTimer = window.setTimeout(printNextCharacter, typewriterDelayMs);
        }

        printNextCharacter();
      }

      convertButton.addEventListener('click', async () => {
        const requestId = ++conversionRequestId;
        stopTypewriter();
        stopConsoleAnimation();

        const text = sourceText.value.trim();
        const seed = seedWord.value.trim();
        const selectedMode = mode.value;

        if (!seed) {
          setStatus('A seed word is required.', 'error');
          return;
        }

        if (!text) {
          setStatus('Enter some text to convert.', 'error');
          return;
        }

        const wordCount = text.split(/\s+/).filter(Boolean).length;
        setConsoleLines([
          '> request queued',
          `> ${selectedMode} mode selected`,
          `> ${wordCount} word(s) ready for conversion`
        ]);
        setButtonLoading(true);
        setStatus('Converting...', 'is-loading');

        try {
          const response = await fetch(convertEndpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text, seed_word: seed, mode: selectedMode })
          });

          const data = await response.json();
          if (requestId !== conversionRequestId) return;

          if (!response.ok) {
            throw new Error(data.error || 'Conversion failed.');
          }

          setButtonLoading(false);
          typeOutput(data.result);
          playConsoleTrace(data.trace);
          setStatus(`Converted successfully in ${selectedMode} mode.`, 'success');
        } catch (error) {
          if (requestId !== conversionRequestId) return;

          setButtonLoading(false);
          stopTypewriter();
          setConsoleLines(['> conversion failed', `> ${error.message}`]);
          setStatus(error.message, 'error');
        }
      });

      window.addEventListener('load', scheduleEmbedResize);
      window.addEventListener('resize', scheduleEmbedResize);

      if ('ResizeObserver' in window) {
        new ResizeObserver(scheduleEmbedResize).observe(document.body);
      }

      scheduleEmbedResize();
    </script>
  </body>
</html>

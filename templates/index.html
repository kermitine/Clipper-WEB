<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clipper Web</title>
    <style>
      :root {
        --bg: #0b0d10;
        --panel: #12161a;
        --panel-soft: #171c21;
        --field: #090b0e;
        --line: #2e353d;
        --line-strong: #48525d;
        --text: #f2f5f6;
        --muted: #9ca8b0;
        --accent: #d83a42;
        --accent-strong: #c4333b;
        --accent-soft: rgba(216, 58, 66, 0.14);
        --ok: #48b38a;
        --ok-soft: rgba(72, 179, 138, 0.12);
        --warn: #ff9aa6;
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-width: 320px;
        background: var(--bg);
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body.is-embed {
        min-height: 360px;
        background: transparent;
      }

      button,
      input,
      textarea {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      .clipper-loader {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: grid;
        place-items: center;
        align-content: center;
        gap: 12px;
        min-height: 360px;
        border: 1px solid var(--line);
        background: var(--bg);
        color: var(--text);
      }

      body.is-embed .clipper-loader {
        position: absolute;
        border-radius: 8px;
      }

      .clipper-loader span {
        width: 34px;
        height: 34px;
        border: 3px solid rgba(216, 58, 66, 0.24);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: clipper-spin 900ms linear infinite;
      }

      .clipper-loader strong {
        font-size: 0.95rem;
        font-weight: 650;
      }

      .clipper-loader[hidden] {
        display: none;
      }

      .clipper-shell {
        width: min(980px, calc(100% - 32px));
        min-height: 100vh;
        margin: 0 auto;
        padding: clamp(16px, 4vw, 32px) 0;
        display: grid;
        align-content: center;
        opacity: 0;
        transform: translateY(6px);
        transition: opacity 180ms ease, transform 180ms ease;
      }

      body.is-embed .clipper-shell {
        width: 100%;
        min-height: 360px;
        padding: 0;
      }

      .clipper-shell.is-loaded {
        opacity: 1;
        transform: translateY(0);
      }

      .converter-panel {
        width: 100%;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
      }

      body.is-standalone .converter-panel {
        box-shadow: 0 18px 42px rgba(0, 0, 0, 0.28);
      }

      body.is-embed .converter-panel {
        min-height: 360px;
      }

      .converter-form {
        padding: 18px;
        display: grid;
        gap: 14px;
      }

      .control-row {
        min-width: 0;
        display: grid;
        grid-template-columns: minmax(220px, 300px) minmax(180px, 1fr);
        gap: 12px;
        align-items: end;
      }

      .mode-control {
        min-height: 40px;
        padding: 3px;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 3px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--field);
      }

      .mode-control label {
        min-width: 0;
        position: relative;
      }

      .mode-control input {
        position: absolute;
        inset: 0;
        opacity: 0;
      }

      .mode-control span {
        min-height: 32px;
        display: grid;
        place-items: center;
        border: 1px solid transparent;
        border-radius: 6px;
        color: var(--muted);
        font-size: 0.9rem;
        font-weight: 700;
        transition: background-color 140ms ease, border-color 140ms ease, color 140ms ease;
      }

      .mode-control input:checked + span {
        border-color: rgba(216, 58, 66, 0.48);
        background: var(--accent-soft);
        color: var(--text);
      }

      .seed-field,
      .text-field {
        min-width: 0;
        display: grid;
        gap: 7px;
      }

      .seed-field > span,
      .text-field > span,
      .console-header {
        color: var(--muted);
        font-size: 0.78rem;
        font-weight: 700;
        text-transform: uppercase;
      }

      .seed-field input,
      textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--field);
        color: var(--text);
        caret-color: var(--accent);
        outline: none;
        transition: border-color 140ms ease, box-shadow 140ms ease;
      }

      .seed-field input {
        min-height: 40px;
        padding: 0 12px;
      }

      .text-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }

      textarea {
        min-height: 210px;
        resize: vertical;
        padding: 13px;
        line-height: 1.55;
      }

      textarea[readonly] {
        color: #dce5e8;
      }

      .seed-field input:focus,
      textarea:focus {
        border-color: rgba(72, 179, 138, 0.68);
        box-shadow: 0 0 0 3px var(--ok-soft);
      }

      textarea.is-populated {
        animation: clipper-result-ready 240ms ease;
      }

      .mode-control input:focus-visible + span,
      .primary-button:focus-visible,
      .ghost-button:focus-visible {
        outline: 2px solid var(--ok);
        outline-offset: 2px;
      }

      .process-console {
        min-width: 0;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--field);
      }

      .console-header {
        min-height: 34px;
        padding: 0 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        border-bottom: 1px solid var(--line);
        background: #0f1317;
      }

      #console-state {
        color: var(--ok);
        text-transform: none;
      }

      #console-state.is-error {
        color: var(--warn);
      }

      #process-log {
        height: 112px;
        margin: 0;
        overflow: auto;
        padding: 10px 12px;
        color: #cfd8dc;
        font: 0.86rem/1.55 "Cascadia Mono", Consolas, monospace;
        white-space: pre-wrap;
        word-break: break-word;
        scrollbar-color: var(--line-strong) var(--field);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
      }

      .primary-button,
      .ghost-button {
        min-height: 40px;
        min-width: 92px;
        padding: 0 14px;
        display: inline-grid;
        place-items: center;
        border-radius: 8px;
        font-weight: 700;
        transition: background-color 140ms ease, border-color 140ms ease, color 140ms ease, opacity 140ms ease;
      }

      .primary-button {
        border: 1px solid rgba(216, 58, 66, 0.72);
        background: var(--accent);
        color: #fff;
      }

      .primary-button:hover {
        background: var(--accent-strong);
      }

      .ghost-button {
        border: 1px solid var(--line);
        background: var(--panel-soft);
        color: var(--text);
      }

      .ghost-button:hover {
        border-color: var(--line-strong);
      }

      .primary-button:disabled,
      .ghost-button:disabled {
        cursor: wait;
        opacity: 0.68;
      }

      .status-line {
        min-height: 22px;
        margin: 0;
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font-size: 0.88rem;
      }

      .status-line.is-loading::before {
        content: "";
        flex: 0 0 auto;
        width: 13px;
        height: 13px;
        border: 2px solid rgba(216, 58, 66, 0.24);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: clipper-spin 800ms linear infinite;
      }

      .status-line.is-error {
        color: var(--warn);
      }

      .status-line.is-success {
        color: var(--ok);
      }

      @media (max-width: 760px) {
        .clipper-shell {
          width: min(100% - 20px, 980px);
          align-content: start;
        }

        .converter-form {
          padding: 14px;
        }

        .control-row,
        .text-grid {
          grid-template-columns: 1fr;
        }

        textarea {
          min-height: 180px;
        }

        .actions {
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .primary-button,
        .ghost-button {
          width: 100%;
          min-width: 0;
        }
      }

      @media (max-width: 420px) {
        .actions {
          grid-template-columns: 1fr;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }
      }

      @keyframes clipper-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes clipper-result-ready {
        from {
          border-color: rgba(72, 179, 138, 0.68);
          box-shadow: 0 0 0 3px var(--ok-soft);
        }
      }
    </style>
  </head>
  <body class="{{ 'is-embed' if embed_mode else 'is-standalone' }}">
    <div class="clipper-loader" id="clipper-loader" role="status" aria-live="polite">
      <span aria-hidden="true"></span>
      <strong>Loading Clipper...</strong>
    </div>

    <main class="clipper-shell" id="clipper-shell" aria-label="Clipper Web converter">
      <section class="converter-panel">
        <form class="converter-form" id="converter-form">
          <div class="control-row">
            <div class="mode-control" role="radiogroup" aria-label="Conversion mode">
              <label>
                <input type="radio" name="mode" value="encrypt" checked>
                <span>Encrypt</span>
              </label>
              <label>
                <input type="radio" name="mode" value="decrypt">
                <span>Decrypt</span>
              </label>
            </div>

            <label class="seed-field" for="seed-word">
              <span>Seed word</span>
              <input id="seed-word" name="seed_word" type="text" value="TEST" placeholder="Enter seed word" autocomplete="off">
            </label>
          </div>

          <div class="text-grid">
            <label class="text-field" for="source-text">
              <span>Input</span>
              <textarea id="source-text" name="text" spellcheck="true" placeholder="Enter text to convert">HELLO WORLD</textarea>
            </label>

            <label class="text-field" for="result-text">
              <span>Output</span>
              <textarea id="result-text" readonly>Ready to translate.</textarea>
            </label>
          </div>

          <section class="process-console" aria-label="Conversion process">
            <div class="console-header">
              <span>Process</span>
              <span id="console-state">idle</span>
            </div>
            <pre id="process-log" role="log" aria-live="polite">waiting for input</pre>
          </section>

          <div class="actions">
            <button class="primary-button" id="convert-button" type="submit">
              <span>Convert</span>
            </button>
            <button class="ghost-button" id="clear-button" type="button">Clear</button>
          </div>

          <p class="status-line" id="status-line" aria-live="polite">Ready</p>
        </form>
      </section>
    </main>

    <script>
      const isEmbed = document.body.classList.contains('is-embed');
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const convertEndpoint = "{{ url_for('convert') }}";

      const loader = document.getElementById('clipper-loader');
      const shell = document.getElementById('clipper-shell');
      const form = document.getElementById('converter-form');
      const convertButton = document.getElementById('convert-button');
      const convertButtonLabel = convertButton.querySelector('span');
      const clearButton = document.getElementById('clear-button');
      const sourceText = document.getElementById('source-text');
      const seedWord = document.getElementById('seed-word');
      const resultText = document.getElementById('result-text');
      const statusLine = document.getElementById('status-line');
      const processLog = document.getElementById('process-log');
      const consoleState = document.getElementById('console-state');

      const typewriterDelayMs = reduceMotion ? 0 : 28;
      const consoleLineDelayMs = reduceMotion ? 0 : 55;
      let typewriterTimer = null;
      let consoleTimer = null;
      let conversionRequestId = 0;
      let embedResizeFrame = null;

      function getSelectedMode() {
        const checkedMode = document.querySelector('input[name="mode"]:checked');
        return checkedMode ? checkedMode.value : 'encrypt';
      }

      function getDocumentHeight() {
        return Math.ceil(Math.max(
          document.body.scrollHeight,
          document.documentElement.scrollHeight,
          document.body.offsetHeight,
          document.documentElement.offsetHeight
        ));
      }

      function postEmbedResize() {
        if (!isEmbed || window.parent === window) return;

        window.parent.postMessage({
          type: 'clipper-web:resize',
          height: getDocumentHeight()
        }, '*');
      }

      function scheduleEmbedResize() {
        if (!isEmbed || window.parent === window || embedResizeFrame) return;

        embedResizeFrame = window.requestAnimationFrame(() => {
          embedResizeFrame = null;
          postEmbedResize();
        });
      }

      function showShell() {
        loader.hidden = true;
        shell.classList.add('is-loaded');
        scheduleEmbedResize();
      }

      function setStatus(message, state = '') {
        statusLine.textContent = message;
        statusLine.className = state ? `status-line ${state}` : 'status-line';
        scheduleEmbedResize();
      }

      function setConsoleState(state, isError = false) {
        consoleState.textContent = state;
        consoleState.className = isError ? 'is-error' : '';
      }

      function setButtonLoading(isLoading, label = 'Convert') {
        convertButton.disabled = isLoading;
        convertButtonLabel.textContent = isLoading ? label : 'Convert';
      }

      function stopTypewriter() {
        window.clearTimeout(typewriterTimer);
        typewriterTimer = null;
        resultText.classList.remove('is-populated');
        resultText.removeAttribute('aria-busy');
        scheduleEmbedResize();
      }

      function stopConsoleAnimation() {
        window.clearTimeout(consoleTimer);
        consoleTimer = null;
        processLog.removeAttribute('aria-busy');
        scheduleEmbedResize();
      }

      function appendConsoleLine(line) {
        const prefix = processLog.textContent ? '\n' : '';
        processLog.textContent += `${prefix}${line}`;
        processLog.scrollTop = processLog.scrollHeight;
        scheduleEmbedResize();
      }

      function setConsoleLines(lines) {
        stopConsoleAnimation();
        processLog.textContent = '';
        lines.forEach(appendConsoleLine);
      }

      function getTraceOutputChange(line) {
        const mappedCharacter = line.match(/^\[word (\d+)\] .+ -> ([A-Z])$/);
        if (mappedCharacter) {
          return {
            wordNumber: Number(mappedCharacter[1]),
            text: mappedCharacter[2]
          };
        }

        const unchangedWord = line.match(/^\[word (\d+)\] number found; returning unchanged: (.*)$/);
        if (unchangedWord) {
          return {
            wordNumber: Number(unchangedWord[1]),
            text: unchangedWord[2]
          };
        }

        return null;
      }

      function completeResult(result) {
        resultText.value = result;
        resultText.classList.remove('is-populated');
        window.requestAnimationFrame(() => {
          resultText.classList.add('is-populated');
          scheduleEmbedResize();
        });
      }

      function playSyncedConversion(result, lines, requestId, onComplete) {
        const traceLines = Array.isArray(lines) && lines.length ? lines : ['> no process trace returned'];
        stopConsoleAnimation();
        stopTypewriter();

        if (reduceMotion) {
          completeResult(result);
          processLog.textContent = '';
          traceLines.forEach(appendConsoleLine);
          onComplete();
          return;
        }

        resultText.value = '';
        resultText.setAttribute('aria-busy', 'true');
        processLog.textContent = '';
        processLog.setAttribute('aria-busy', 'true');

        let lineIndex = 0;
        let lastSyncedWordNumber = 0;

        function finishAnimation() {
          if (requestId !== conversionRequestId) return;

          completeResult(result);
          stopTypewriter();
          stopConsoleAnimation();
          onComplete();
        }

        function printNextLine() {
          if (requestId !== conversionRequestId) return;

          if (lineIndex >= traceLines.length) {
            finishAnimation();
            return;
          }

          const line = traceLines[lineIndex];
          appendConsoleLine(line);
          lineIndex += 1;

          const outputChange = getTraceOutputChange(line);
          if (outputChange === null) {
            consoleTimer = window.setTimeout(printNextLine, consoleLineDelayMs);
            return;
          }

          const needsWordSpacing = resultText.value && outputChange.wordNumber !== lastSyncedWordNumber;
          const segmentWithSpacing = `${needsWordSpacing ? ' ' : ''}${outputChange.text}`;
          lastSyncedWordNumber = outputChange.wordNumber;
          let characterIndex = 0;

          function printNextOutputCharacter() {
            if (requestId !== conversionRequestId) return;

            if (characterIndex >= segmentWithSpacing.length) {
              consoleTimer = window.setTimeout(printNextLine, consoleLineDelayMs);
              return;
            }

            resultText.value += segmentWithSpacing.charAt(characterIndex);
            resultText.scrollTop = resultText.scrollHeight;
            characterIndex += 1;
            scheduleEmbedResize();
            typewriterTimer = window.setTimeout(printNextOutputCharacter, typewriterDelayMs);
          }

          printNextOutputCharacter();
        }

        printNextLine();
      }

      form.addEventListener('submit', async event => {
        event.preventDefault();
        const requestId = ++conversionRequestId;
        stopTypewriter();
        stopConsoleAnimation();

        const text = sourceText.value.trim();
        const seed = seedWord.value.trim();
        const selectedMode = getSelectedMode();

        if (!seed) {
          setConsoleState('error', true);
          setStatus('A seed word is required.', 'is-error');
          seedWord.focus();
          return;
        }

        if (!text) {
          setConsoleState('error', true);
          setStatus('Enter some text to convert.', 'is-error');
          sourceText.focus();
          return;
        }

        const wordCount = text.split(/\s+/).filter(Boolean).length;
        resultText.value = '';
        setConsoleState('working');
        setConsoleLines([
          '> request queued',
          `> ${selectedMode} mode selected`,
          `> ${wordCount} word(s) ready for conversion`
        ]);
        setButtonLoading(true, 'Converting...');
        setStatus('Converting...', 'is-loading');

        try {
          const response = await fetch(convertEndpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text, seed_word: seed, mode: selectedMode })
          });

          const data = await response.json();
          if (requestId !== conversionRequestId) return;

          if (!response.ok) {
            throw new Error(data.error || 'Conversion failed.');
          }

          setButtonLoading(true, 'Rendering...');
          setStatus('Printing synchronized trace...', 'is-loading');
          playSyncedConversion(data.result, data.trace, requestId, () => {
            if (requestId !== conversionRequestId) return;
            setConsoleState('complete');
            setButtonLoading(false);
            setStatus(`Converted successfully in ${selectedMode} mode.`, 'is-success');
          });
        } catch (error) {
          if (requestId !== conversionRequestId) return;

          setButtonLoading(false);
          stopTypewriter();
          setConsoleState('error', true);
          setConsoleLines(['> conversion failed', `> ${error.message}`]);
          setStatus(error.message, 'is-error');
        }
      });

      clearButton.addEventListener('click', () => {
        conversionRequestId += 1;
        stopTypewriter();
        stopConsoleAnimation();
        setButtonLoading(false);
        sourceText.value = '';
        resultText.value = '';
        resultText.classList.remove('is-populated');
        setConsoleState('idle');
        setConsoleLines(['waiting for input']);
        setStatus('Ready');
        sourceText.focus();
      });

      window.addEventListener('resize', scheduleEmbedResize);

      if ('ResizeObserver' in window) {
        new ResizeObserver(scheduleEmbedResize).observe(document.body);
      }

      if (document.readyState === 'complete') {
        window.setTimeout(showShell, 0);
      } else {
        window.addEventListener('load', showShell, { once: true });
      }
    </script>
  </body>
</html>
